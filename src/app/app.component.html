<div class="h-screen flex flex-col bg-[#1b2838] overflow-hidden text-[#c7d5e0] bg-red-500">
  <!-- Top Bar / Navigation (Steam Style) -->
  <header class="bg-[#171a21] border-b border-white/5 px-6 py-4 flex items-center justify-between z-50 shadow-2xl">
    <div class="flex items-center gap-8">
      <div class="flex items-center gap-3 group cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 to-indigo-600 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
          <span class="material-icons text-white">favorite</span>
        </div>
        <h1 class="text-xl font-black tracking-tighter text-white uppercase italic">Logros<span class="text-rose-500">Pareja</span></h1>
      </div>
      
      <nav class="hidden md:flex items-center gap-6">
        <a routerLink="/" routerLinkActive="text-white border-rose-500" [routerLinkActiveOptions]="{exact: true}"
           class="text-xs font-black uppercase tracking-[0.2em] py-2 border-b-2 border-transparent hover:text-white transition-all">BIBLIOTECA</a>
        <a routerLink="/categorias" routerLinkActive="text-white border-rose-500"
           class="text-xs font-black uppercase tracking-[0.2em] py-2 border-b-2 border-transparent hover:text-white transition-all">EXPLORAR</a>
      </nav>
    </div>

    <div class="flex items-center gap-4">
      <div class="hidden sm:flex items-center gap-2 bg-[#1b2838] px-4 py-2 rounded-xl border border-white/5">
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-[10px] font-black uppercase tracking-widest text-emerald-400">EN LÍNEA</span>
      </div>
      <div class="w-10 h-10 rounded-full border-2 border-rose-500 p-0.5 overflow-hidden">
        <img src="https://ui-avatars.com/api/?name=Pareja&background=e11d48&color=fff" class="w-full h-full rounded-full" alt="Profile">
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto pb-24 md:pb-6 relative">
    <!-- Ambient Background Glow -->
    <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-rose-600/10 rounded-full blur-[150px] -z-10 pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[150px] -z-10 pointer-events-none"></div>
    
    <router-outlet></router-outlet>
  </main>

  <!-- Mobile Bottom Navigation (Always visible on mobile) -->
  <div class="md:hidden fixed bottom-0 left-0 w-full z-50 p-4">
    <nav class="bg-[#171a21]/90 backdrop-blur-xl border border-white/5 rounded-3xl px-8 py-3 flex justify-around items-center shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
      <a routerLink="/" routerLinkActive="text-white scale-110" [routerLinkActiveOptions]="{exact: true}"
         class="flex flex-col items-center text-[#c7d5e0]/50 hover:text-white transition-all duration-300 group">
        <span class="material-icons text-2xl group-active:scale-75 transition-transform">dashboard</span>
      </a>
      
      <div class="w-px h-6 bg-white/10"></div>

      <a routerLink="/categorias" routerLinkActive="text-white scale-110"
         class="flex flex-col items-center text-[#c7d5e0]/50 hover:text-white transition-all duration-300 group">
        <span class="material-icons text-2xl group-active:scale-75 transition-transform">auto_awesome_mosaic</span>
      </a>
    </nav>
  </div>
</div>
