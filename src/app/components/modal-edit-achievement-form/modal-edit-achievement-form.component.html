<div *ngIf="isOpen" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity animate-fade-in" (click)="!isLoading && !isUploading && closeModal()"></div>

  <!-- Modal Content -->
  <div class="relative bg-white rounded-t-[3rem] sm:rounded-[3rem] w-full max-w-lg shadow-2xl overflow-hidden animate-slide-in-up">
    <!-- Drag Handle for Mobile -->
    <div class="sm:hidden w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-2"></div>

    <div class="p-8 pt-4 sm:pt-8 overflow-y-auto max-h-[90vh]">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h3 class="text-2xl font-black text-slate-900 tracking-tight">Editar Logro</h3>
          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Actualiza los detalles</p>
        </div>
        <button [disabled]="isLoading || isUploading" (click)="closeModal()" class="w-10 h-10 flex items-center justify-center bg-slate-50 text-slate-400 hover:text-slate-600 rounded-2xl transition-all active:scale-90 flex-shrink-0">
          <span class="material-icons">close</span>
        </button>
      </div>

      <form [formGroup]="form" class="space-y-6">
        
        <!-- Photo Section -->
        <div>
          <label class="text-xs font-black text-slate-700 uppercase tracking-widest block mb-2">Foto del Logro</label>
          
          <!-- Estado 1: No se está recortando imagen -->
          <div *ngIf="!imageChangedEvent" 
               class="relative w-full h-40 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 hover:bg-slate-100 transition-colors overflow-hidden flex items-center justify-center group cursor-pointer"
               [ngClass]="{'border-indigo-300': currentImageUrl, 'opacity-50 pointer-events-none': isLoading}">
            
            <input type="file" (change)="fileChangeEvent($event)" accept="image/png, image/jpeg, image/jpg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" [disabled]="isLoading">
            
            <!-- Si ya tiene foto guardada -->
            <ng-container *ngIf="currentImageUrl">
              <img [src]="currentImageUrl" class="absolute inset-0 w-full h-full object-cover z-0" alt="Current Photo">
              <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity z-10 flex items-center justify-center">
                <span class="text-white font-bold text-sm flex items-center gap-2">
                  <span class="material-icons">edit</span> Cambiar foto
                </span>
              </div>
            </ng-container>

            <!-- Si NO tiene foto guardada -->
            <div *ngIf="!currentImageUrl" class="text-center z-10 text-slate-400 group-hover:text-indigo-500 transition-colors">
              <span class="material-icons text-4xl mb-1">add_photo_alternate</span>
              <p class="text-xs font-bold uppercase tracking-widest">Subir Imagen</p>
            </div>
          </div>

          <!-- Estado 2: Cropper Activo -->
          <div *ngIf="imageChangedEvent" class="animate-fade-in space-y-4">
            <div class="rounded-2xl overflow-hidden bg-slate-900 shadow-inner border border-slate-200">
              <image-cropper
                [imageChangedEvent]="imageChangedEvent"
                [maintainAspectRatio]="true"
                [aspectRatio]="1 / 1"
                format="jpeg"
                (imageCropped)="imageCropped($event)"
                class="max-h-[250px]">
              </image-cropper>
            </div>
            <button [disabled]="isLoading || isUploading" (click)="resetPhoto()" type="button" class="w-full py-3 px-4 bg-slate-100 text-slate-600 rounded-xl font-bold uppercase tracking-widest hover:bg-slate-200 active:scale-95 transition-all text-xs">
              Cancelar Cambio
            </button>
          </div>
        </div>

        <!-- Title Field -->
        <div>
          <label class="text-xs font-black text-slate-700 uppercase tracking-widest block mb-2">Título</label>
          <input type="text" formControlName="title" [disabled]="isLoading || isUploading"
            class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-slate-900 font-bold transition-colors disabled:bg-slate-50"
            placeholder="Título del logro">
        </div>

        <!-- Description Field -->
        <div>
          <label class="text-xs font-black text-slate-700 uppercase tracking-widest block mb-2">Descripción</label>
          <textarea formControlName="description" [disabled]="isLoading || isUploading"
            class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-slate-900 font-bold transition-colors disabled:bg-slate-50 resize-none"
            placeholder="Descripción del logro" rows="3"></textarea>
        </div>

        <!-- Level Field -->
        <div>
          <label class="text-xs font-black text-slate-700 uppercase tracking-widest block mb-2">Nivel</label>
          <select formControlName="levelId" [disabled]="isLoading || isUploading"
            class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-slate-900 font-bold transition-colors disabled:bg-slate-50 appearance-none bg-white">
            <option value="">Selecciona un nivel</option>
            <option *ngFor="let level of levels" [value]="level.id">{{ level.name }} (+{{ level.points }} pts)</option>
          </select>
        </div>

        <!-- Form Actions -->
        <div class="flex gap-4 pt-4">
          <button type="button" [disabled]="isLoading || isUploading" (click)="closeModal()"
            class="flex-1 py-4 px-6 bg-slate-100 text-slate-600 text-xs font-black uppercase tracking-widest rounded-2xl hover:bg-slate-200 active:scale-95 transition-all disabled:opacity-50">
            Cancelar
          </button>
          <button type="button" [disabled]="!form.valid || isLoading || isUploading" (click)="submitForm()"
            class="flex-[2] py-4 px-6 bg-gradient-to-r from-indigo-500 to-indigo-600 text-white text-xs font-black uppercase tracking-[0.2em] rounded-2xl shadow-xl shadow-indigo-200 hover:shadow-indigo-300 active:scale-95 transition-all flex justify-center items-center disabled:opacity-70">
            <span *ngIf="!isLoading && !isUploading">Guardar Cambios</span>
            <div *ngIf="isLoading || isUploading" class="animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
