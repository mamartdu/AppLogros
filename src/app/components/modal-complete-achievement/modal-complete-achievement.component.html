<div *ngIf="isOpen" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity animate-fade-in" (click)="closeModal()"></div>

  <!-- Modal Content (Bottom Sheet on Mobile) -->
  <div class="relative bg-white rounded-t-[3rem] sm:rounded-[3rem] w-full max-w-lg shadow-2xl overflow-hidden animate-slide-in-up">
    <!-- Drag Handle for Mobile -->
    <div class="sm:hidden w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-2"></div>

    <div class="p-8 pt-4 sm:pt-8">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h3 class="text-2xl font-black text-slate-900 tracking-tight">Completar Logro</h3>
          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">¡Felicidades!</p>
        </div>
        <button (click)="closeModal()" class="w-10 h-10 flex items-center justify-center bg-slate-50 text-slate-400 hover:text-slate-600 rounded-2xl transition-all active:scale-90">
          <span class="material-icons">close</span>
        </button>
      </div>

      <div *ngIf="achievement" class="mb-8 p-6 bg-rose-50 rounded-[2rem] border border-rose-100/50 flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center shadow-sm">
          <span class="material-icons text-rose-500">favorite</span>
        </div>
        <div>
          <h4 class="font-black text-rose-600 leading-tight">{{ achievement.title }}</h4>
          <p class="text-[10px] font-black text-rose-400 uppercase tracking-widest mt-1">+{{ achievement.points }} puntos de amor</p>
        </div>
      </div>

      <!-- Botón de completar -->
      <div class="flex gap-4">
        <button 
          type="button"
          (click)="closeModal()"
          class="flex-1 py-4 px-6 bg-slate-100 text-slate-600 text-xs font-black uppercase tracking-widest rounded-2xl hover:bg-slate-200 active:scale-95 transition-all">
          Cancelar
        </button>
        <button 
          type="button"
          (click)="confirmCompletion()"
          class="flex-[2] py-4 px-6 bg-gradient-to-r from-rose-500 to-indigo-600 text-white text-xs font-black uppercase tracking-[0.2em] rounded-2xl shadow-xl shadow-rose-200 hover:shadow-rose-300 active:scale-95 transition-all flex justify-center items-center">
          Completar Logro
        </button>
      </div>
    </div>
  </div>
</div>
