<div class="min-h-screen bg-gradient-to-br from-[#1b2838] to-[#0f1419] p-6 md:p-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="mb-12 animate-fade-in">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 md:gap-0">
        <div>
          <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight">
            Mis Categorías
          </h1>
          <p class="text-white/50 mt-2 text-lg">Explora los retos disponibles</p>
        </div>
        
        <!-- Stats -->
        <div class="flex gap-4">
          <div class="glass rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs font-semibold text-white/60 uppercase tracking-widest">Total</p>
            <p class="text-2xl font-bold text-white">{{ totalCompleted }}/{{ totalAchievements }}</p>
          </div>
          <div class="glass rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs font-semibold text-white/60 uppercase tracking-widest">Logros</p>
            <p class="text-2xl font-bold text-white">{{ categories.length }}</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Action Buttons -->
    <div class="mb-8 flex flex-col sm:flex-row gap-3">
      <button (click)="openCreateCategoryModal()" class="flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-[#66c0f4] to-[#1a9fff] text-white font-bold uppercase tracking-widest rounded-xl hover:shadow-lg hover:shadow-[#66c0f4]/50 active:scale-95 transition-all">
        <span class="material-icons">add_circle</span>
        Crear Categoría
      </button>
      <button (click)="openCreateAchievementModal()" class="flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-[#1a9fff] to-[#0ea5e9] text-white font-bold uppercase tracking-widest rounded-xl hover:shadow-lg hover:shadow-[#0ea5e9]/50 active:scale-95 transition-all">
        <span class="material-icons">star_circle</span>
        Crear Logro
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center items-center py-20">
      <div class="animate-spin">
        <span class="material-icons text-5xl text-[#66c0f4]">category</span>
      </div>
    </div>

    <!-- Categories Grid -->
    <div *ngIf="!isLoading" class="grid grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
      <a *ngFor="let cat of categories; let i = index" 
         [routerLink]="['/categoria', cat.id]"
         class="group relative rounded-2xl glass border border-white/10 overflow-hidden transition-all duration-300 hover:border-white/30 hover:shadow-2xl animate-slide-in-up"
         [style]="'animation-delay: ' + (i * 0.1) + 's'">
        
        <div class="aspect-square p-6 flex flex-col items-center justify-center text-center relative overflow-hidden">
          <!-- Background Gradient -->
          <div class="absolute inset-0 opacity-20 group-hover:opacity-40 transition-opacity"
               [style]="'background: linear-gradient(135deg, ' + cat.color + '30 0%, ' + cat.color + '00 100%)'"></div>

          <!-- Icon -->
          <div class="relative mb-4">
            <span class="material-icons text-6xl transition-transform group-hover:scale-110 group-hover:rotate-6"
                  [style]="'color: ' + cat.color">{{ cat.icon }}</span>
          </div>

          <!-- Category Name -->
          <h3 class="text-lg font-bold text-white mb-4 relative z-10">
            {{ cat.name }}
          </h3>

          <!-- Progress Bar -->
          <div class="w-full mt-auto relative z-10">
            <div class="h-2 bg-white/10 rounded-full overflow-hidden mb-2">
              <div class="h-full transition-all duration-500"
                   [style]="'width: ' + cat.progressPercentage + '%; background: ' + cat.color"></div>
            </div>
            <p class="text-xs text-white/70">
              <span class="font-bold" [style]="'color: ' + cat.color">{{ cat.completedAchievements }}</span>/{{ cat.totalAchievements }}
            </p>
          </div>
        </div>
      </a>
    </div>

    <!-- Back Button -->
    <div class="mt-12 flex justify-center">
      <button routerLink="/"
              class="glass rounded-xl px-6 py-3 border border-white/10 text-white/70 hover:text-white transition-all hover:border-white/30">
        <span class="material-icons align-middle mr-2">arrow_back</span>
        Volver al Dashboard
      </button>
    </div>
  </div>
</div>

<!-- Modal Create Category -->
<app-modal-create-category
  [isOpen]="isModalCreateCategoryOpen"
  (close)="closeCreateCategoryModal()"
  (created)="onCategoryCreated($event)">
</app-modal-create-category>

<!-- Modal Create Achievement -->
<app-modal-create-achievement-form
  [isOpen]="isModalCreateAchievementOpen"
  [categories]="categories"
  [levels]="levels"
  (close)="closeCreateAchievementModal()"
  (created)="onAchievementCreated($event)">
</app-modal-create-achievement-form>
